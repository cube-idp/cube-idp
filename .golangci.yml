version: "2"

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - funlen
  settings:
    funlen:
      lines: 50
      ignore-comments: true
  exclusions:
    rules:
      # Table-driven test functions are dominated by their case tables;
      # the 50-line limit stays for production code only (rules audit f2).
      - path: _test\.go
        linters:
          - funlen

formatters:
  enable:
    - gofmt
    - goimports
