name: Bug report
description: Shipped behavior is wrong
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands and cube.yaml (or minimal fragment). Paste output, not paraphrase.
      placeholder: |
        $ cube-idp init ...
        <actual output>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`cube-idp version` output or commit SHA"
    validations:
      required: true
