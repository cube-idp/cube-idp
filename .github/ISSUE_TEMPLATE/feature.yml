name: Feature request
description: New capability or enhancement
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch of the change. Closed scope — what is explicitly OUT.
    validations:
      required: true
  - type: dropdown
    id: design-gate
    attributes:
      label: Does this need a design gate?
      description: New domain, new dependency, new seam, or a contract change → yes (reviewed ARCHITECTURE/domain diff + DECISIONS.md entry before code, per CLAUDE.md §6).
      options: ["no — routine work within existing decisions", "yes — design gate first", "unsure — triage decides"]
    validations:
      required: true
