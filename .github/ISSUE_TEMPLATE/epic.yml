name: Epic (milestone pickup)
description: Open when a ROADMAP milestone is picked up — task breakdown aligned before work starts
title: "epic: "
labels: ["epic"]
body:
  - type: input
    id: roadmap
    attributes:
      label: Roadmap milestone
      description: The ROADMAP.md entry this epic delivers, e.g. "M5 — cluster lifecycle completion"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One paragraph. What ships when this epic closes; what is explicitly out. Name the design gate if one applies (CLAUDE.md §6).
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Task breakdown
      description: One line per task issue (each becomes its own `task` issue referencing this epic). The final task is always "Docs & architecture consistent and updated".
      placeholder: |
        - [ ] #NN task one
        - [ ] #NN task two
        - [ ] #NN Docs & architecture consistent and updated
    validations:
      required: true
