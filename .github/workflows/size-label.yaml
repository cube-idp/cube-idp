name: size-label
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Maps non-generated changed lines to the §6 size-s|m|l|xl labels.
            // Generated/rendered assets are excluded from the count, like the
            // filelen gate: zz_generated* and the C4 SVG exports.
            const EXCLUDED = [/(^|\/)zz_generated/, /^docs\/architecture\/.*\.svg$/];
            const BANDS = [[1000, 'size-xl'], [500, 'size-l'], [100, 'size-m'], [0, 'size-s']];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const lines = files
              .filter((f) => !EXCLUDED.some((re) => re.test(f.filename)))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const want = BANDS.find(([min]) => lines >= min)[1];

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const stale = pr.labels
              .map((l) => l.name)
              .filter((n) => n.startsWith('size-') && n !== want);
            for (const name of stale) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name,
              });
            }
            if (!pr.labels.some((l) => l.name === want)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [want],
              });
            }
            core.info(`${lines} counted lines -> ${want}`);
