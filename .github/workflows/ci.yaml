name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: make test
      - run: make build
      - name: generated code is committed and reproducible
        run: make generate && git diff --exit-code api/
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: file-length gate (files <300 lines, zz_generated exempt)
        run: make filelen
      - uses: golangci/golangci-lint-action@v8
        with: {version: latest}
