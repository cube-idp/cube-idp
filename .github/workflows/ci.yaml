name: ci
on:
  push: {branches: [main]}
  # e2e/sync-fixture holds the e2e sync fixture — three YAML files, no Go
  # source — so these gates cannot judge a pull request based on it. Naming the
  # branch exactly rather than globbing e2e/**: a glob would silently suppress
  # CI on any future branch under that prefix. This filter does not prevent a
  # pull request being opened; it only stops the gates running. Filters on
  # pull_request match the BASE branch.
  pull_request: {branches-ignore: [e2e/sync-fixture]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: make test
      - run: make build
      - name: generated code is committed and reproducible
        run: make generate && git diff --exit-code api/
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: file-length gate (files <300 lines, zz_generated exempt)
        run: make filelen
      - uses: golangci/golangci-lint-action@v8
        with: {version: latest}
